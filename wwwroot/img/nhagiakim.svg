<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000"/>
      <stop offset="50%" stop-color="#799F0C"/>
      <stop offset="100%" stop-color="#FFE000"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="580" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="360" height="540" rx="8" fill="none" stroke="#f6d365" stroke-width="2" opacity="0.6"/>
  <rect x="26" y="26" width="348" height="528" rx="6" fill="none" stroke="#f6d365" stroke-width="0.8" opacity="0.4"/>

  <!-- Desert & Sun Art -->
  <circle cx="200" cy="270" r="85" fill="url(#sunGrad)" opacity="0.9" filter="url(#glow)"/>
  <path d="M 30 380 Q 120 320 220 350 T 370 380 L 370 470 L 30 470 Z" fill="#b9770e" opacity="0.75"/>
  <path d="M 30 360 Q 150 410 270 360 T 370 390 L 370 470 L 30 470 Z" fill="#d4ac0d" opacity="0.85"/>
  <path d="M 30 400 Q 180 340 370 410 L 370 470 L 30 470 Z" fill="#7d6608" opacity="0.9"/>

  <!-- Pyramids Silhouettes -->
  <polygon points="120,340 160,280 200,340" fill="#2c3e50" opacity="0.9"/>
  <polygon points="185,340 220,295 255,340" fill="#1a252f" opacity="0.95"/>

  <!-- Camel Caravan Silhouette -->
  <path d="M 170 385 Q 175 378 180 380 Q 185 375 190 380 L 190 390 L 170 390 Z" fill="#111"/>

  <!-- Top Badges / Author -->
  <text x="200" y="70" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#f6d365" letter-spacing="4" text-anchor="middle">KIỆT TÁC VĂN HỌC THẾ GIỚI</text>
  
  <text x="200" y="115" font-family="'Roboto', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">PAULO COELHO</text>

  <!-- Main Title -->
  <text x="200" y="180" font-family="'Roboto', sans-serif" font-size="34" font-weight="900" fill="#f6d365" text-anchor="middle" filter="url(#glow)">NHÀ GIẢ KIM</text>
  <text x="200" y="215" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" fill="#e0e0e0" letter-spacing="3" text-anchor="middle">THE ALCHEMIST</text>

  <!-- Bottom Details -->
  <text x="200" y="500" font-family="'Roboto', sans-serif" font-size="12" font-style="italic" fill="#ffffff" text-anchor="middle">Bản dịch trọn vẹn của Lê Chu Cầu</text>
  <text x="200" y="530" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#f6d365" letter-spacing="1" text-anchor="middle">NHÀ XUẤT BẢN HỘI NHÀ VĂN</text>
</svg>
